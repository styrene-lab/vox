[package]
name = "vox-voice"
version = "0.1.0"
edition = "2021"
description = "Voice I/O (STT/TTS) connector for vox"

[dependencies]
vox-core = { path = "../vox-core" }
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
