[package]
name = "vox"
version = "0.1.0"
edition = "2021"
description = "Omegon communication connector extension"

[[bin]]
name = "vox"
path = "src/main.rs"

[dependencies]
vox-core = { path = "../vox-core" }
omegon-extension = { path = "../../omegon/core/crates/omegon-extension" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
