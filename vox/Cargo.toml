[package]
name = "vox"
version = "0.1.6"
edition = "2021"
description = "Omegon communication connector extension"

[[bin]]
name = "vox"
path = "src/main.rs"

[features]
default = []
signal = ["dep:vox-signal"]
email = ["dep:vox-email"]
# lxmf: disabled until styrene-rs crates are published to crates.io
# lxmf = ["dep:vox-lxmf"]
voice = ["dep:vox-voice"]
slack = ["dep:vox-slack"]
discord = ["dep:vox-discord"]
all = ["signal", "email", "voice", "slack", "discord"]

[dependencies]
vox-core = { path = "../vox-core" }
omegon-extension = "0.15.24"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"

# Feature-gated connector crates — only linked when enabled.
# Interactive omegon users never pull these; only daemon/OCI builds opt in.
vox-signal = { path = "../vox-signal", optional = true }
vox-email = { path = "../vox-email", optional = true }
# vox-lxmf: disabled until styrene-rs crates are published
# vox-lxmf = { path = "../vox-lxmf", optional = true }
vox-voice = { path = "../vox-voice", optional = true }
vox-slack = { path = "../vox-slack", optional = true }
vox-discord = { path = "../vox-discord", optional = true }
