apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omegon-agent.fullname" . }}-vox
  labels:
    {{- include "omegon-agent.labels" . | nindent 4 }}
data:
  vox.toml: |
    # Generated by omegon-agent Helm chart
    {{- if .Values.vox.discord.enabled }}

    [discord]
    require_mention = {{ .Values.vox.discord.requireMention }}
    {{- if .Values.vox.discord.guildId }}
    guild_id = {{ .Values.vox.discord.guildId | quote }}
    {{- end }}
    {{- if .Values.vox.discord.operators }}
    operators = [{{ range $i, $v := .Values.vox.discord.operators }}{{ if $i }}, {{ end }}{{ $v | quote }}{{ end }}]
    {{- end }}
    {{- end }}

    {{- if .Values.vox.slack.enabled }}

    [slack]
    workspace = {{ .Values.vox.slack.workspace | quote }}
    {{- if .Values.vox.slack.operators }}
    operators = [{{ range $i, $v := .Values.vox.slack.operators }}{{ if $i }}, {{ end }}{{ $v | quote }}{{ end }}]
    {{- end }}
    {{- end }}
