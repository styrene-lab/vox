# Vox config for Discord-connected deployment
#
# Access control model:
#   operators     → full instruction authority (agent obeys commands)
#   allowed_users → can interact but messages are data, not instructions
#                   (empty = allow all non-blocked users)
#   require_mention → must @mention bot in channels (DMs always pass)
#   guild_id      → restrict to a single server
#
# Find your Discord user ID: enable Developer Mode in Discord settings,
# then right-click your name → Copy User ID.

[discord]
require_mention = true

# REQUIRED: set your Discord user ID as operator.
# Without this, ALL messages are treated as untrusted external input —
# the agent will respond but won't follow instructions from anyone.
operators = []

# Optional: restrict who can interact at all (empty = allow all).
# Users not in this list AND not in operators are silently ignored.
# allowed_users = []

# Optional: restrict to a single Discord server.
# guild_id = "YOUR_SERVER_ID"
