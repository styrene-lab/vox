[package]
name = "vox-core"
version = "0.1.5"
edition = "2021"
description = "Core abstractions for vox communication connectors"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
secrecy = { version = "0.10", features = ["serde"] }
toml = "0.8"
