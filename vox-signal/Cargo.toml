[package]
name = "vox-signal"
version = "0.1.4"
edition = "2021"
description = "Signal connector for vox"

[dependencies]
vox-core = { path = "../vox-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
